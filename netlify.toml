[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Single-page app fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "#custom"
  command = "npx vite"
  targetPort = 3000
